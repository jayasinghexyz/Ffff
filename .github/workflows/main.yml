name: VIDURA_ULTIMATE_RDP
on:
  workflow_dispatch:
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600
    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Allow" dir=in action=allow protocol=TCP localport=3389
      
      - name: Enable Audio Services & Recording
        run: |
          Write-Host "Starting audio services..."
          sc.exe config Audiosrv start= auto
          sc.exe config AudioEndpointBuilder start= auto
          Start-Service -Name Audiosrv -ErrorAction SilentlyContinue
          Start-Service -Name AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          
          Write-Host "Enabling all audio devices..."
          # Enable all disabled audio devices (including Stereo Mix)
          Get-PnpDevice -Class AudioEndpoint | Where-Object {$_.Status -ne "OK"} | Enable-PnpDevice -Confirm:$false -ErrorAction SilentlyContinue
          
          Write-Host "Audio setup complete"
      
      - name: Create RDP User
        run: |
          $password = "BhashaShilpi@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "ViduraAdmin" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "ViduraAdmin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ViduraAdmin" -ErrorAction SilentlyContinue
          echo "PASSWORD=$password" >> $env:GITHUB_ENV
      
      - name: Install and Setup Tailscale
        run: |
          Write-Host "Installing Tailscale..."
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "$env:TEMP\tailscale.msi", "/quiet" -Wait
          Start-Sleep -Seconds 10
          
          Write-Host "Connecting to Tailscale..."
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=vidura-god-mode
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TS_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Keep Alive & Info
        run: |
          Write-Host "`n╔════════════════════════════════════════╗"
          Write-Host "║       VIDURA RDP + AUDIO READY        ║"
          Write-Host "╚════════════════════════════════════════╝"
          Write-Host ""
          Write-Host "📡 IP Address : $env:TS_IP"
          Write-Host "👤 Username   : ViduraAdmin"
          Write-Host "🔑 Password   : $env:PASSWORD"
          Write-Host ""
          Write-Host "🎤 Audio Recording Setup:"
          Write-Host "   1. RDP connect වෙන්න"
          Write-Host "   2. Sound Settings > Input වලට යන්න"
          Write-Host "   3. Recording device එකක් select කරන්න"
          Write-Host "   4. AI Studio හෝ Voice Recorder open කරන්න"
          Write-Host ""
          Write-Host "💡 Tip: Chrome browser එකෙන් වැඩ කරන්න"
          Write-Host "   online AI tools වලට microphone access දෙන්න"
          Write-Host ""
          Write-Host "⏳ Keeping session alive...`n"
          
          while ($true) { 
            Start-Sleep -Seconds 300
            Write-Host "$(Get-Date -Format 'HH:mm:ss') - Session active"
          }
